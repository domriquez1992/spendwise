# The Spendwise application itself. Stateless (identity travels in the JWT), so it scales
# horizontally as a Deployment. Config and credentials are injected from the ConfigMap and Secret;
# an init container blocks startup until every dependency is reachable, giving a deterministic
# bring-up order instead of relying on crash-loop-and-retry.
apiVersion: v1
kind: Service
metadata:
  name: spendwise
  labels:
    app: spendwise
spec:
  selector:
    app: spendwise
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise
  labels:
    app: spendwise
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spendwise
  template:
    metadata:
      labels:
        app: spendwise
    spec:
      initContainers:
        # Wait for every backing service to accept connections before the app boots. PostgreSQL and
        # MongoDB are required at context startup (JPA schema sync, Mongo index creation); waiting
        # for all four keeps the rollout clean and ordered.
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for backing services..."
              until nc -z db 5432;    do echo "  db not ready";    sleep 2; done
              until nc -z mongo 27017; do echo "  mongo not ready"; sleep 2; done
              until nc -z redis 6379;  do echo "  redis not ready"; sleep 2; done
              until nc -z kafka 9092;  do echo "  kafka not ready"; sleep 2; done
              echo "All dependencies reachable."
      containers:
        - name: spendwise
          image: spendwise:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: spendwise-config
            - secretRef:
                name: spendwise-secret
          # Startup probe guards the (relatively slow) Spring Boot boot so the liveness probe can't
          # kill the pod mid-startup. Once it passes, liveness and readiness take over.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
