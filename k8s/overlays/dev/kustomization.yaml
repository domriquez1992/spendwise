apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The dev overlay deploys the base as-is, pinning the application image to the tag that CI builds
# and loads into the kind cluster (spendwise:dev). Additional overlays (e.g. prod) would layer on
# replica counts, resource limits, real secrets, and an Ingress.
resources:
  - ../../base

images:
  - name: spendwise
    newTag: dev
