spring:
  application:
    name: spendwise
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise}
    username: ${SPRING_DATASOURCE_USERNAME:spendwise}
    password: ${SPRING_DATASOURCE_PASSWORD:spendwise}
  jpa:
    hibernate:
      # Pragmatic for a portfolio/demo. A production service would manage the
      # schema with versioned migrations (Flyway or Liquibase) instead.
      ddl-auto: update
    # Disable the Open Session In View anti-pattern: keep the persistence
    # context confined to the service/transaction layer.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    # In production, point this at your broker(s) via KAFKA_BOOTSTRAP_SERVERS. The integration
    # test overrides it with a Testcontainers broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 JSON serializer (Spring Kafka 4 / Spring Boot 4).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: spendwise-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Deserialize event payloads to this type, and only trust this package.
        spring.json.value.default.type: com.domriquez.spendwise.event.ExpenseCreatedEvent
        spring.json.trusted.packages: com.domriquez.spendwise.event
  data:
    mongodb:
      # Audit-log document store. In production point at your cluster via SPRING_DATA_MONGODB_URI;
      # the integration test overrides this with a Testcontainers MongoDB instance.
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/spendwise}
      auto-index-creation: true
    redis:
      # Cache backing store. Overridden by the Testcontainers Redis instance in integration tests.
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cache:
    type: redis
    redis:
      # Summary entries expire after 10 minutes as a safety net even if an eviction is missed.
      time-to-live: 10m
      cache-null-values: false

server:
  port: 8080

app:
  jwt:
    # Dev-only default. MUST be overridden in production via the JWT_SECRET environment
    # variable. HMAC-SHA-256 needs a key of at least 256 bits (32 bytes); this string is well
    # above that length when read as UTF-8 bytes.
    secret: ${JWT_SECRET:dev-secret-change-me-spendwise-please-override-in-production-0123456789}
    # Access-token lifetime in milliseconds (default: 1 hour).
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  budget:
    # When a user's spending in a category for the month exceeds this amount, a budget
    # notification is generated. Override per environment via APP_BUDGET_MONTHLY_CATEGORY_LIMIT.
    monthly-category-limit: ${APP_BUDGET_MONTHLY_CATEGORY_LIMIT:1000}
