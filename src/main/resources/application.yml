spring:
  application:
    name: spendwise
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise}
    username: ${SPRING_DATASOURCE_USERNAME:spendwise}
    password: ${SPRING_DATASOURCE_PASSWORD:spendwise}
  jpa:
    hibernate:
      # Pragmatic for a portfolio/demo. A production service would manage the
      # schema with versioned migrations (Flyway or Liquibase) instead.
      ddl-auto: update
    # Disable the Open Session In View anti-pattern: keep the persistence
    # context confined to the service/transaction layer.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    # In production, point this at your broker(s) via KAFKA_BOOTSTRAP_SERVERS. The integration
    # test overrides it with a Testcontainers broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Jackson 3 JSON serializer (Spring Kafka 4 / Spring Boot 4).
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: spendwise-notifications
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Deserialize event payloads to this type, and only trust this package.
        spring.json.value.default.type: com.domriquez.spendwise.event.ExpenseCreatedEvent
        spring.json.trusted.packages: com.domriquez.spendwise.event
  mongodb:
    # MongoDB CONNECTION settings. In Spring Boot 4 the Mongo driver auto-configuration was split
    # out of Spring Data into its own module, and the connection properties moved from
    # `spring.data.mongodb.*` to `spring.mongodb.*` (MongoProperties is now
    # @ConfigurationProperties("spring.mongodb")). Keys left under spring.data.mongodb.* are silently
    # ignored for connectivity, which is why a uri/host set there fell back to localhost:27017.
    # Overridden by the "docker" profile (mongo:27017) for the Compose stack; the integration test
    # overrides it entirely via Testcontainers @ServiceConnection.
    uri: mongodb://localhost:27017/spendwise
  data:
    mongodb:
      # Spring DATA Mongo behaviour (not connectivity) stays under spring.data.mongodb.*.
      auto-index-creation: true
    redis:
      # Cache backing store. Redis connection config remains under spring.data.redis in Boot 4
      # (Redis was not split into a separate driver module). The "docker" profile overrides host/port
      # with concrete Compose values; the integration test overrides them via @ServiceConnection.
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      # Summary entries expire after 10 minutes as a safety net even if an eviction is missed.
      time-to-live: 10m
      cache-null-values: false

server:
  port: 8080

app:
  jwt:
    # Dev-only default. MUST be overridden in production via the JWT_SECRET environment
    # variable. HMAC-SHA-256 needs a key of at least 256 bits (32 bytes); this string is well
    # above that length when read as UTF-8 bytes.
    secret: ${JWT_SECRET:dev-secret-change-me-spendwise-please-override-in-production-0123456789}
    # Access-token lifetime in milliseconds (default: 1 hour).
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  budget:
    # When a user's spending in a category for the month exceeds this amount, a budget
    # notification is generated. Override per environment via APP_BUDGET_MONTHLY_CATEGORY_LIMIT.
    monthly-category-limit: ${APP_BUDGET_MONTHLY_CATEGORY_LIMIT:1000}

management:
  endpoints:
    web:
      exposure:
        # health + the readiness/liveness probe groups (orchestration), info (build metadata),
        # metrics (browseable meter list), and prometheus (the scrape endpoint). Everything else
        # stays internal. In production these management endpoints would typically be bound to a
        # separate, network-restricted port (management.server.port); they are on the main port
        # here to keep the demo single-port and the existing probes/smoke tests unchanged.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Enable the liveness/readiness probe groups, used by container orchestrators (and the
      # Compose/Kubernetes probes).
      probes:
        enabled: true
  metrics:
    tags:
      # Tag every meter with the application name so a multi-service Prometheus can distinguish them.
      application: ${spring.application.name}
  # Metrics pipeline: Prometheus scrapes /actuator/prometheus. The OpenTelemetry starter also ships
  # an OTLP metrics registry that would otherwise push metrics to localhost:4318; disable it so
  # there is exactly one metrics path (Prometheus scrape) and nothing tries to reach a collector.
  otlp:
    metrics:
      export:
        enabled: false
  # Distributed tracing. Sample every request (appropriate for a low-traffic demo; lower in
  # production) so each request carries a trace/span id that Micrometer Tracing puts into the
  # logging MDC. Spans are exported only when an OTLP endpoint is configured (the observability
  # overlay sets management.opentelemetry.tracing.export.otlp.endpoint to Tempo); unset here, so
  # the default run and CI generate ids locally without exporting anything.
  tracing:
    sampling:
      probability: 1.0
